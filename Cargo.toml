[package]
name = "fftui"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A macOS-first terminal interface for single-file FFmpeg transcoding"

[dependencies]
anyhow = "1"
crossterm = "0.28"
nix = { version = "0.29", features = ["process", "signal"] }
ratatui = "0.29"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
unicode-width = "0.2"
